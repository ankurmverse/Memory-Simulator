[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-page-replacement"
version = "0.1.0"
description = "A trace-driven page replacement simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
plots = ["matplotlib>=3.8"]
ml = ["scikit-learn>=1.4", "joblib>=1.3"]
app = ["streamlit>=1.50"]

[project.scripts]
page-replacement = "page_replacement.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
